services:
  mysql:
    image: mysql:8.0
    container_name: mysql-gestionprojets
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      retries: 10
  backend:
    image: akremjouini-4ssa16-gestionprojets-backend:latest
    container_name: backend-gestionprojets
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"
  frontend:
    image: akremjouini-4ssa16-gestionprojets-frontend:latest
    container_name: frontend-gestionprojets
    depends_on:
      - backend
    ports:
      - "4200:80"
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-gestionprojets
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-gestionprojets
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
volumes:
  mysql-data:
